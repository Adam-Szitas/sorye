# admin.sorye.app gateway. Hub enforces the same allowlist, the security headers
# and the platform-admin check; this layer keeps customer routes unreachable here.
server {
    listen 8080;
    absolute_redirect off;
    server_name _;
    server_tokens off;
    # Console writes are small JSON bodies.
    client_max_body_size 64k;

    location = /healthz { access_log off; return 200 'ok'; }
    location = / { return 307 /admin; }

    location ~ ^/(admin|api/admin|api/operator|api/auth|_next)(/|$) { include /etc/nginx/conf.d/hub-proxy.inc; }
    location = /login { include /etc/nginx/conf.d/hub-proxy.inc; }
    location = /favicon.ico { include /etc/nginx/conf.d/hub-proxy.inc; }
    location = /api/backend/topology { include /etc/nginx/conf.d/hub-proxy.inc; }
    location = /api/backend/capabilities { include /etc/nginx/conf.d/hub-proxy.inc; }

    location / { return 404; }
}
