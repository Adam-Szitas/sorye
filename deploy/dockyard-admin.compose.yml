name: sorye-admin
services:
  web:
    image: ${SORYE_ADMIN_IMAGE:?Set immutable admin gateway image}
    restart: unless-stopped
    environment:
      HUB_UPSTREAM: ${HUB_UPSTREAM:?Set reachable internal Hub URL}
    ports: ["127.0.0.1:${SORYE_ADMIN_PORT:-8130}:8080"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /etc/nginx/conf.d]
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
