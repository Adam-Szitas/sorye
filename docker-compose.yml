services:
  postgres:
    image: postgres:16-alpine
    container_name: sorye-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sorye
      POSTGRES_PASSWORD: sorye
      POSTGRES_DB: sorye
    volumes:
      - sorye_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorye -d sorye"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sorye_pg_data:
